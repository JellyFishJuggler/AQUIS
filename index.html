<!DOCTYPE html>
<html>
<head>
  <title>AQUIS Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f7fb;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: white;
      padding: 20px;
      height: 100vh;
      border-right: 1px solid #ddd;
    }

    .sidebar h2 {
      color: #1f6feb;
    }

    .menu div {
      padding: 10px;
      margin: 5px 0;
      cursor: pointer;
      border-radius: 5px;
    }

    .menu div:hover {
      background: #eef2ff;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
    }

    .card {
      background: linear-gradient(135deg, #1f6feb, #3aa0ff);
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card h1 {
      font-size: 50px;
      margin: 0;
    }

    /* GRID */
    .grid {
      display: flex;
      gap: 20px;
    }

    .small-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      flex: 1;
    }

    /* SEARCH */
    .search {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    /* STATIONS */
    .station {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .bar {
      height: 6px;
      background: #ddd;
      margin-top: 10px;
      border-radius: 5px;
    }

    .fill {
      height: 6px;
      border-radius: 5px;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>HydroManage</h2>

  <div class="menu">
    <div>Overview</div>
    <div>Live Map</div>
    <div>Station List</div>
    <div>Alerts</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- BIG CARD -->
  <div class="card">
    <h3>Groundwater Level</h3>
    <h1 id="mainValue">--</h1>
    <p id="status">Loading...</p>
  </div>

  <!-- SMALL CARDS -->
  <div class="grid">
    <div class="small-card">
      <h3>Temperature</h3>
      <p>28°C</p>
    </div>

    <div class="small-card">
      <h3>Station Power</h3>
      <p>85%</p>
    </div>
  </div>

  <!-- SEARCH -->
  <h3>Nearby Stations</h3>

  <input 
    type="text" 
    id="searchBox" 
    class="search"
    placeholder="Search by district or state..."
    onkeyup="filterStations()"
  />

  <div id="stations"></div>

</div>

<script>

let allStations = [];

async function loadData() {
  const res = await fetch("http://localhost:3000/stations");
  const data = await res.json();

  allStations = data;

  renderStations(data);

  if (data.length) {
    document.getElementById("mainValue").innerText =
      data[0].water_level.toFixed(2);

    document.getElementById("status").innerText =
      data[0].status;
  }
}

function getColor(status) {
  if (status === "SAFE") return "green";
  if (status === "WARNING") return "orange";
  return "red";
}

function renderStations(data) {
  const container = document.getElementById("stations");
  container.innerHTML = "";

  data.slice(0, 10).forEach(st => {
    container.innerHTML += `
      <div class="station">
        <strong>${st.district}</strong> (${st.state})
        <div>${st.water_level.toFixed(2)} | ${st.status}</div>

        <div class="bar">
          <div class="fill" 
            style="
              width:${Math.min(st.water_level/1000,100)}%;
              background:${getColor(st.status)};
            ">
          </div>
        </div>
      </div>
    `;
  });
}

function filterStations() {
  const value = document.getElementById("searchBox").value.toLowerCase();

  const filtered = allStations.filter(st =>
    (st.district && st.district.toLowerCase().includes(value)) ||
    (st.state && st.state.toLowerCase().includes(value))
  );

  renderStations(filtered);
}

loadData();

</script>

</body>
</html>
